<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件收集柜 - 管理后台</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: rgba(22, 30, 49, 0.6);
            --panel-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.25);
            --success: #10b981;
            --error: #ef4444;
            --card-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.1) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.05) 0px, transparent 50%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            background: var(--panel-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--panel-border);
            padding: 20px 30px;
            border-radius: 20px;
            box-shadow: var(--card-shadow);
        }

        .top-bar h1 {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(to right, #a5b4fc, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Grid Layout */
        .box-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        /* Card Style */
        .box-card {
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: var(--card-shadow);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .box-card:hover {
            transform: translateY(-5px);
            border-color: rgba(99, 102, 241, 0.3);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.35);
        }

        .card-header {
            margin-bottom: 15px;
            position: relative;
        }

        .card-badge {
            position: absolute;
            top: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
            border-radius: 8px;
            padding: 4px 10px;
            font-size: 11px;
            font-weight: 600;
        }

        .card-badge.active {
            color: var(--success);
            background: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.15);
        }

        .card-badge.expired {
            color: var(--error);
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.15);
        }

        .box-card h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 6px;
            max-width: 75%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .box-card p {
            color: var(--text-secondary);
            font-size: 13px;
            line-height: 1.4;
            height: 40px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .card-stats {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            padding: 12px;
            margin: 18px 0;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            font-size: 12px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .stat-label {
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .stat-value {
            font-weight: 600;
        }

        .card-actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .card-actions button {
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* Buttons */
        .btn {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            box-shadow: 0 0 15px var(--accent-glow);
            opacity: 0.95;
        }

        .btn-subtle {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
        }

        .btn-subtle:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.12);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: var(--error);
        }

        .btn-danger:hover {
            background: var(--error);
            color: white;
        }

        /* Modal overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 15, 25, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal {
            background: #151e31;
            border: 1px solid var(--panel-border);
            width: 100%;
            max-width: 500px;
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            animation: modalUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            overflow: hidden;
        }

        @keyframes modalUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            padding: 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            font-size: 18px;
            font-weight: 700;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
        }

        .modal-body {
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .modal-footer {
            padding: 20px 25px;
            background: rgba(0, 0, 0, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        /* Form Controls */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .form-control {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 10px 14px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .form-control:focus {
            border-color: var(--accent);
        }

        /* File List Modal */
        .file-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 350px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .file-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .file-item-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-width: 70%;
        }

        .file-item-name {
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-item-meta {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .file-actions {
            display: flex;
            gap: 10px;
        }

        /* Password Overlay for Auth */
        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-card {
            background: #111827;
            border: 1px solid var(--panel-border);
            width: 100%;
            max-width: 400px;
            border-radius: 24px;
            padding: 35px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
        }

        .auth-card h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .auth-card p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 25px;
        }

        .no-data {
            text-align: center;
            grid-column: 1 / -1;
            padding: 50px 20px;
            color: var(--text-secondary);
            font-size: 15px;
        }
    </style>
</head>
<body>

<!-- 登录验证遮罩层 -->
<div class="auth-overlay" id="auth-overlay">
    <div class="auth-card">
        <h2>身份验证</h2>
        <p>此页面需要管理员权限，请输入后台登录密码。</p>
        <div class="form-group" style="margin-bottom: 20px;">
            <input type="password" id="admin-password" class="form-control" placeholder="请输入管理员密码" style="text-align: center;">
        </div>
        <button class="btn" style="width: 100%; justify-content: center;" onclick="handleLogin()">确认登录</button>
    </div>
</div>

<div class="container">
    <!-- Top Bar -->
    <div class="top-bar">
        <div>
            <h1>文件收集柜管理后台</h1>
            <p style="font-size: 13px; color: var(--text-secondary); margin-top: 4px;">管理和提取收集到的文件</p>
        </div>
        <button class="btn" onclick="openCreateModal()">
            <svg style="width:16px;height:16px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
            新建收集柜
        </button>
    </div>

    <!-- Box Grid -->
    <div class="box-grid" id="box-grid">
        <div class="no-data">加载数据中...</div>
    </div>
</div>

<!-- 新建收集柜 Modal -->
<div class="modal-overlay" id="create-modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <h2>新建文件收集柜</h2>
            <button class="close-btn" onclick="closeCreateModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label for="box-name-input">收集柜名称 (必填)</label>
                <input type="text" id="box-name-input" class="form-control" placeholder="例如：2026年团建照片收集">
            </div>
            <div class="form-group">
                <label for="box-desc-input">描述信息</label>
                <textarea id="box-desc-input" class="form-control" placeholder="提示用户上传什么类型的文件，或者说明文字" style="height: 70px; resize: none;"></textarea>
            </div>
            <div class="form-group">
                <label for="box-size-input">单文件最大限制 (MB，0为不限制)</label>
                <input type="number" id="box-size-input" class="form-control" value="0">
            </div>
            <div class="form-group">
                <label for="box-exts-input">限制后缀名 (英文逗号分隔，例如: jpg,png,pdf，留空为不限制)</label>
                <input type="text" id="box-exts-input" class="form-control" placeholder="jpg,png">
            </div>
            <div class="form-group">
                <label for="box-maxfiles-input">收集数量上限 (0为不限制)</label>
                <input type="number" id="box-maxfiles-input" class="form-control" value="0">
            </div>
            <div class="form-group">
                <label for="box-expire-input">有效期截止时间 (留空为永久有效)</label>
                <input type="datetime-local" id="box-expire-input" class="form-control">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-subtle" onclick="closeCreateModal()">取消</button>
            <button class="btn" onclick="submitCreateBox()">创建</button>
        </div>
    </div>
</div>

<!-- 查看文件 Modal -->
<div class="modal-overlay" id="files-modal-overlay">
    <div class="modal" style="max-width: 600px;">
        <div class="modal-header">
            <h2 id="files-modal-title">已收集的文件</h2>
            <button class="close-btn" onclick="closeFilesModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div class="file-list" id="modal-file-list"></div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-subtle" onclick="closeFilesModal()">关闭</button>
        </div>
    </div>
</div>

<script>
    // Init state
    let token = localStorage.getItem("token") || "";
    
    // Auto check JWT on startup
    if (token) {
        document.getElementById("auth-overlay").style.display = "none";
        loadBoxesList();
    }

    async function handleLogin() {
        const password = document.getElementById("admin-password").value;
        if (!password) {
            alert("密码不能为空！");
            return;
        }

        try {
            const res = await fetch("/admin/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ password })
            });
            const data = await res.json();
            if (res.status === 200 && data.code === 200) {
                token = data.detail.token;
                localStorage.setItem("token", token);
                document.getElementById("auth-overlay").style.display = "none";
                loadBoxesList();
            } else {
                alert("密码错误，登录失败！");
            }
        } catch (e) {
            alert("网络连接出错！");
        }
    }

    // Modal control
    function openCreateModal() {
        document.getElementById("create-modal-overlay").style.display = "flex";
    }

    function closeCreateModal() {
        document.getElementById("create-modal-overlay").style.display = "none";
        // Reset form
        document.getElementById("box-name-input").value = "";
        document.getElementById("box-desc-input").value = "";
        document.getElementById("box-size-input").value = "0";
        document.getElementById("box-exts-input").value = "";
        document.getElementById("box-maxfiles-input").value = "0";
        document.getElementById("box-expire-input").value = "";
    }

    // Fetch lists
    async function loadBoxesList() {
        try {
            const res = await fetch("/api/admin/collect/list", {
                headers: { "Authorization": `Bearer ${token}` }
            });
            
            if (res.status === 401) {
                // Token invalid
                localStorage.removeItem("token");
                document.getElementById("auth-overlay").style.display = "flex";
                return;
            }

            const data = await res.json();
            if (data.code === 200) {
                renderBoxesList(data.detail);
            } else {
                alert("获取列表失败: " + data.detail);
            }
        } catch (e) {
            alert("获取列表网络错误");
        }
    }

    function renderBoxesList(boxes) {
        const container = document.getElementById("box-grid");
        container.innerHTML = "";

        if (!boxes || boxes.length === 0) {
            container.innerHTML = `<div class="no-data">暂无收集柜，点击右上角创建一个吧！</div>`;
            return;
        }

        boxes.forEach(box => {
            const isExpired = box.expired_at ? new Date(box.expired_at) < new Date() : false;
            let statusHTML = '<span class="card-badge active">收集中</span>';
            if (isExpired) {
                statusHTML = '<span class="card-badge expired">已过期</span>';
            } else if (box.max_files > 0 && box.collected_count >= box.max_files) {
                statusHTML = '<span class="card-badge expired">已满额</span>';
            }

            const sizeDisplay = box.max_file_size > 0 ? `${(box.max_file_size / (1024*1024)).toFixed(1)} MB` : "无限制";
            const extDisplay = box.allowed_extensions ? box.allowed_extensions : "所有格式";

            const card = document.createElement("div");
            card.className = "box-card";
            card.innerHTML = `
                <div class="card-header">
                    <h3>${escapeHtml(box.name)}</h3>
                    ${statusHTML}
                    <p style="margin-top: 8px;">${escapeHtml(box.description || "无描述信息")}</p>
                </div>

                <div style="font-size: 13px; color: var(--text-secondary); margin-bottom: 5px;">
                    提取码代码: <strong style="color: var(--accent); cursor: pointer;" onclick="copyLink('${box.code}')">${box.code} (点此复制链接)</strong>
                </div>

                <div class="card-stats">
                    <div>
                        <div class="stat-label">单文件限制</div>
                        <div class="stat-value">${sizeDisplay}</div>
                    </div>
                    <div>
                        <div class="stat-label">限制格式</div>
                        <div class="stat-value" title="${extDisplay}" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100px;">${extDisplay}</div>
                    </div>
                    <div>
                        <div class="stat-label">当前进度</div>
                        <div class="stat-value" style="color: var(--accent); font-weight: bold;">${box.collected_count} ${box.max_files > 0 ? `/ ${box.max_files}` : ''} 个</div>
                    </div>
                    <div>
                        <div class="stat-label">过期时间</div>
                        <div class="stat-value">${box.expired_at ? new Date(box.expired_at).toLocaleDateString() : "永久"}</div>
                    </div>
                </div>

                <div class="card-actions">
                    <button class="btn btn-subtle" onclick="viewBoxFiles(${box.id})">查看文件</button>
                    <button class="btn" onclick="downloadZip(${box.id})" ${box.collected_count === 0 ? 'disabled' : ''}>打包下载</button>
                    <button class="btn btn-danger" style="grid-column: 1 / -1; margin-top: 5px;" onclick="deleteBox(${box.id})">删除收集柜</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // Submit Creation
    async function submitCreateBox() {
        const name = document.getElementById("box-name-input").value.trim();
        const description = document.getElementById("box-desc-input").value.trim();
        const sizeMB = parseFloat(document.getElementById("box-size-input").value) || 0;
        const allowed_extensions = document.getElementById("box-exts-input").value.trim();
        const max_files = parseInt(document.getElementById("box-maxfiles-input").value) || 0;
        const expireVal = document.getElementById("box-expire-input").value;

        if (!name) {
            alert("收集柜名称为必填项！");
            return;
        }

        const max_file_size = sizeMB * 1024 * 1024; // Convert to bytes
        const expired_at = expireVal ? new Date(expireVal).toISOString() : null;

        try {
            const res = await fetch("/api/admin/collect/create", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },
                body: JSON.stringify({
                    name,
                    description,
                    max_file_size,
                    allowed_extensions: allowed_extensions || null,
                    expired_at,
                    max_files
                })
            });

            const data = await res.json();
            if (data.code === 200) {
                closeCreateModal();
                loadBoxesList();
            } else {
                alert("创建失败: " + data.detail);
            }
        } catch (e) {
            alert("网络请求出错！");
        }
    }

    function copyToClipboard(text) {
        return new Promise((resolve, reject) => {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(resolve).catch(reject);
            } else {
                const textarea = document.createElement("textarea");
                textarea.value = text;
                textarea.style.position = "fixed";
                textarea.style.opacity = "0";
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    const successful = document.execCommand("copy");
                    document.body.removeChild(textarea);
                    if (successful) {
                        resolve();
                    } else {
                        reject(new Error("execCommand copy failed"));
                    }
                } catch (err) {
                    document.body.removeChild(textarea);
                    reject(err);
                }
            }
        });
    }

    // Action Methods
    function copyLink(code) {
        const host = window.location.origin;
        const fullLink = `${host}/collect/${code}`;
        copyToClipboard(fullLink).then(() => {
            alert(`链接已成功复制到剪贴板:\n${fullLink}`);
        }).catch(() => {
            alert(`手动复制链接:\n${fullLink}`);
        });
    }

    async function downloadZip(boxId) {
        // 创建并显示打包中的加载提示遮罩层
        const loadingDiv = document.createElement("div");
        loadingDiv.id = "zip-loading-overlay";
        loadingDiv.style.position = "fixed";
        loadingDiv.style.top = "0";
        loadingDiv.style.left = "0";
        loadingDiv.style.width = "100vw";
        loadingDiv.style.height = "100vh";
        loadingDiv.style.background = "rgba(11, 15, 25, 0.8)";
        loadingDiv.style.display = "flex";
        loadingDiv.style.flexDirection = "column";
        loadingDiv.style.justifyContent = "center";
        loadingDiv.style.alignItems = "center";
        loadingDiv.style.zIndex = "99999";
        loadingDiv.innerHTML = `
            <div style="background: #161e31; padding: 30px; border-radius: 12px; border: 1px solid var(--panel-border); text-align: center; color: var(--text-primary); max-width: 90%; width: 400px; box-shadow: var(--card-shadow);">
                <div style="font-size: 1.5rem; font-weight: bold; margin-bottom: 15px;">正在打包文件...</div>
                <div style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 20px;">请稍候，这可能需要一点时间。</div>
                <div class="spinner" style="border: 4px solid rgba(255,255,255,0.1); width: 36px; height: 36px; border-radius: 50%; border-left-color: var(--accent); animation: spin 1s linear infinite; margin: 0 auto;"></div>
            </div>
            <style>
                @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
            </style>
        `;
        document.body.appendChild(loadingDiv);

        try {
            const res = await fetch(`/api/admin/collect/${boxId}/zip/prepare`, {
                headers: { "Authorization": `Bearer ${token}` }
            });
            const data = await res.json();
            
            if (document.getElementById("zip-loading-overlay")) {
                document.body.removeChild(loadingDiv);
            }
            
            if (data.code === 200 && data.detail && data.detail.zip_name) {
                const zipName = data.detail.zip_name;
                window.location.href = `/api/admin/collect/zip/download/${zipName}?token=${encodeURIComponent(token)}`;
            } else {
                alert("打包失败: " + (data.detail || "未知错误"));
            }
        } catch (e) {
            if (document.getElementById("zip-loading-overlay")) {
                document.body.removeChild(loadingDiv);
            }
            alert("打包下载请求出错！");
        }
    }


    async function deleteBox(boxId) {
        if (!confirm("警告：确定要删除该收集柜吗？这将永久删除该收集箱以及该箱子中收集的所有物理文件！")) {
            return;
        }

        try {
            const res = await fetch(`/api/admin/collect/${boxId}`, {
                method: "DELETE",
                headers: { "Authorization": `Bearer ${token}` }
            });
            const data = await res.json();
            if (data.code === 200) {
                loadBoxesList();
            } else {
                alert("删除失败: " + data.detail);
            }
        } catch (e) {
            alert("网络请求出错！");
        }
    }

    // View files list inside box
    let currentOpenBoxId = null;

    async function viewBoxFiles(boxId) {
        currentOpenBoxId = boxId;
        const fileListContainer = document.getElementById("modal-file-list");
        fileListContainer.innerHTML = '<div class="no-data">加载中...</div>';
        document.getElementById("files-modal-overlay").style.display = "flex";

        try {
            const res = await fetch(`/api/admin/collect/${boxId}/files`, {
                headers: { "Authorization": `Bearer ${token}` }
            });
            const data = await res.json();
            
            if (data.code === 200) {
                document.getElementById("files-modal-title").innerText = `已收集文件: ${data.detail.box.name}`;
                renderModalFiles(data.detail.files);
            } else {
                fileListContainer.innerHTML = `<div class="no-data" style="color: var(--error)">加载失败: ${data.detail}</div>`;
            }
        } catch (e) {
            fileListContainer.innerHTML = '<div class="no-data" style="color: var(--error)">网络请求失败！</div>';
        }
    }

    function renderModalFiles(files) {
        const fileListContainer = document.getElementById("modal-file-list");
        fileListContainer.innerHTML = "";

        if (!files || files.length === 0) {
            fileListContainer.innerHTML = '<div class="no-data">该收集柜目前还没有收集到任何文件。</div>';
            return;
        }

        files.forEach(file => {
            const fileItem = document.createElement("div");
            fileItem.className = "file-item";
            fileItem.innerHTML = `
                <div class="file-item-info">
                    <span class="file-item-name" title="${file.prefix}${file.suffix}">${file.prefix}${file.suffix}</span>
                    <span class="file-item-meta">${formatBytes(file.size)} &bull; ${new Date(file.created_at).toLocaleString()}</span>
                </div>
                <div class="file-actions">
                    <button class="btn btn-subtle" style="padding: 6px 12px; font-size: 11px;" onclick="downloadSingleFile(${file.id})">下载</button>
                    <button class="btn btn-danger" style="padding: 6px 12px; font-size: 11px;" onclick="deleteSingleFile(${file.id})">删除</button>
                </div>
            `;
            fileListContainer.appendChild(fileItem);
        });
    }

    function closeFilesModal() {
        document.getElementById("files-modal-overlay").style.display = "none";
        loadBoxesList(); // Refresh count
    }

    async function downloadSingleFile(fileId) {
        try {
            const res = await fetch(`/api/admin/collect/file/${fileId}/download`, {
                headers: { "Authorization": `Bearer ${token}` }
            });
            if (res.status === 200) {
                const blob = await res.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                
                const disposition = res.headers.get('content-disposition');
                let filename = "download_file";
                if (disposition && disposition.indexOf('attachment') !== -1) {
                    const filenameRegex = /filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/;
                    const matches = filenameRegex.exec(disposition);
                    if (matches != null && matches[1]) { 
                        filename = decodeURIComponent(matches[1].replace(/['"]/g, ''));
                    }
                }
                
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(url);
            } else {
                alert("下载失败，文件可能已在磁盘中丢失！");
            }
        } catch (e) {
            alert("下载网络出错！");
        }
    }

    async function deleteSingleFile(fileId) {
        if (!confirm("确定要删除该文件吗？")) return;
        try {
            const res = await fetch(`/admin/file/delete`, {
                method: "DELETE",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },
                body: JSON.stringify({ id: fileId })
            });
            const data = await res.json();
            if (data.code === 200) {
                viewBoxFiles(currentOpenBoxId);
            } else {
                alert("删除失败: " + data.detail);
            }
        } catch (e) {
            alert("删除网络出错！");
        }
    }

    // Helper functions
    function escapeHtml(text) {
        if (!text) return "";
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function formatBytes(bytes, decimals = 2) {
        if (bytes === 0) return '0 Bytes';
        const k = 1024;
        const dm = decimals < 0 ? 0 : decimals;
        const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
    }
</script>
